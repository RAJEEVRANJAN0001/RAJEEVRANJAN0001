<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Cyan to Green Linear Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    
    <!-- Deep Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1000" height="240" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Animated grid lines in background -->
  <g stroke="rgba(57, 255, 20, 0.08)" stroke-width="1">
    <!-- Horizontal Grid lines -->
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    
    <!-- Vertical Grid lines -->
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" />
  </g>

  <!-- Glowing circuit visual details -->
  <path d="M 50,120 L 150,120 L 180,90 L 300,90" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.3" />
  <circle cx="300" cy="90" r="3" fill="#39FF14" opacity="0.6" />
  
  <path d="M 950,120 L 850,120 L 820,150 L 700,150" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.3" />
  <circle cx="700" cy="150" r="3" fill="#00F0FF" opacity="0.6" />

  <!-- Animated pulsating center hub (Rotating Ring) -->
  <circle cx="500" cy="120" r="85" fill="none" stroke="url(#cyberGrad)" stroke-width="0.75" stroke-dasharray="12, 18" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" from="0 500 120" to="360 500 120" dur="25s" repeatCount="indefinite" />
  </circle>

  <!-- Core Title -->
  <text x="500" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="4">
    RAJEEV RANJAN PRATAP SINGH
  </text>

  <!-- Subtitle -->
  <text x="500" y="155" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" fill="url(#cyberGrad)" text-anchor="middle" letter-spacing="2">
    AI / MACHINE LEARNING &amp; FULL STACK ARCHITECT
  </text>
  
  <!-- Glowing neon border line at bottom -->
  <line x1="50" y1="210" x2="950" y2="210" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)" />
</svg>
