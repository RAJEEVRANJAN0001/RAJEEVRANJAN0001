<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="100%" height="180">
  <defs>
    <!-- Glow Gradients -->
    <linearGradient id="glowGradRetino" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8b949e" />
    </linearGradient>
    <filter id="glowRetino">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Border & Background -->
  <rect width="480" height="180" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle cyber grid lines in background -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="0.75">
    <line x1="20" y1="0" x2="20" y2="180" />
    <line x1="120" y1="0" x2="120" y2="180" />
    <line x1="220" y1="0" x2="220" y2="180" />
    <line x1="320" y1="0" x2="320" y2="180" />
    <line x1="420" y1="0" x2="420" y2="180" />
    <line x1="0" y1="45" x2="480" y2="45" />
    <line x1="0" y1="90" x2="480" y2="90" />
    <line x1="0" y1="135" x2="480" y2="135" />
  </g>
  
  <!-- Side Highlight Bar -->
  <rect x="0" y="0" width="6" height="180" rx="3" fill="url(#glowGradRetino)" filter="url(#glowRetino)" />
  
  <!-- Tech Icon/Tag -->
  <text x="25" y="32" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1.5">[ MODULE_03 // CLINICAL CV ]</text>
  
  <!-- Project Title -->
  <text x="25" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Diabetic Retinopathy Core</text>
  
  <!-- Description -->
  <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">
    Automated retinal scan diagnostic classifier for diabetic
  </text>
  <text x="25" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">
    retinopathy severity grading across a 5-stage scale.
  </text>
  
  <!-- Telemetry Bar -->
  <text x="25" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#ffffff">ACCURACY: 92%</text>
  
  <!-- Progress Track -->
  <rect x="120" y="124" width="220" height="8" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <!-- Progress Fill -->
  <rect x="120" y="124" width="202" height="8" rx="4" fill="url(#glowGradRetino)" filter="url(#glowRetino)" />
  
  <!-- Tech badges -->
  <g transform="translate(25, 148)">
    <rect x="0" y="0" width="55" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="27.5" y="12.5" font-family="-apple-system, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">DenseNet</text>
    
    <rect x="61" y="0" width="45" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="22.5" y="12.5" font-family="-apple-system, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Keras</text>
    
    <rect x="112" y="0" width="55" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="139.5" y="12.5" font-family="-apple-system, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">OpenCV</text>

    <rect x="173" y="0" width="50" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="198" y="12.5" font-family="-apple-system, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Python</text>
  </g>
  
  <!-- Pulsating status indicator in upper right -->
  <circle cx="450" cy="28" r="5" fill="#ffffff" filter="url(#glowRetino)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="435" y="32" font-family="'Fira Code', monospace" font-size="10" fill="#8b949e" text-anchor="end">SYS_DEPLOY</text>
</svg>
