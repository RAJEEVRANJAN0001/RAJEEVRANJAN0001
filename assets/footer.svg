<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="80">
  <defs>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="80" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <line x1="50" y1="40" x2="950" y2="40" stroke="url(#cyanGreen)" stroke-width="1.5" stroke-dasharray="10, 15" opacity="0.3" />
  <text x="500" y="46" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="url(#cyanGreen)" filter="url(#neon)" text-anchor="middle" letter-spacing="3">
    NEURAL NODE LATTICE TERMINATED
  </text>
  <circle cx="500" cy="40" r="4" fill="#39FF14">
    <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
</svg>
