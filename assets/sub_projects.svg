<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 48" width="100%" height="48">
  <defs>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="0" y="0" width="8" height="48" rx="3" fill="url(#cyanGreen)" filter="url(#neon)" />
  <text x="25" y="30" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" fill="#39FF14">&gt;&gt;</text>
  <text x="60" y="30" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="1">
    CONVOLUTIONAL PIPELINES : ACTIVE MODEL NODES
  </text>
  <circle cx="960" cy="24" r="5" fill="#39FF14" filter="url(#neon)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
